<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Movie Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <header class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-ticket logo-icon"></i>
                <h1>Movie <span class="underline">hub</span></h1>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="privacy.html">Privacy Policy</a>
                <a href="contact.html" style="color: #ffffff;">Contact</a>
                <i class="fa-solid fa-bars mobile-menu"></i>
            </nav>
        </header>

        <main class="contact-main">
            <div class="contact-header">
                <h2>Get in Touch</h2>
                <p>Have questions, movie suggestions, or feedback? We'd love to hear from you.</p>
            </div>

            <div class="contact-container">
                <!-- Contact Information -->
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <p>Fill out the form and our team will get back to you within 24 hours.</p>
                    
                    <div class="info-item">
                        <i class="fa-solid fa-envelope"></i>
                        <span>support@moviehub.com</span>
                    </div>
                    <div class="info-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>Cinematic Universe, Earth</span>
                    </div>
                    
                    <div class="social-links">
                        <a href="#"><i class="fa-brands fa-twitter"></i></a>
                        <a href="#"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#"><i class="fa-brands fa-github"></i></a>
                    </div>
                </div>

                <!-- Contact Form -->
                <form class="contact-form">
                    <div class="input-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="Tell us what's on your mind..." required></textarea>
                    </div>
                    
                    <button type="submit" class="contact-submit-btn">Send Message</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
